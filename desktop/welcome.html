<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PyMagic</title>
<!-- The welcome screen of a window without a project (after Close Project): New project, Open folder, the demo and the recent projects. -->
<style>
  :root { --bg: #0f111a; --panel: #161925; --line: #262b3d; --text: #bcc1d6; --dim: #7c839c; --accent: #82aaff; --hover: #1f2335; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #ffffff; --line: #dde0e6; --text: #23262f; --dim: #6b7080; --accent: #2f6fdb; --hover: #eceef3; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: var(--bg); color: var(--text); font: 14px "Segoe UI", system-ui, sans-serif; display: flex; }
  aside { width: 260px; padding: 28px 22px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  .version { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; text-align: left; cursor: pointer; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { flex: 1; padding: 28px 32px; overflow: auto; }
  h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  input { width: 100%; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  li:hover, li:focus { background: var(--hover); outline: none; }
  .name { font-weight: 600; }
  .path { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .text { flex: 1; min-width: 0; }
  .remove { visibility: hidden; border: 0; background: none; color: var(--dim); padding: 2px 6px; }
  li:hover .remove, li:focus .remove { visibility: visible; }
  .empty { color: var(--dim); }
</style>
</head>
<body>
<aside>
  <h1>PyMagic</h1>
  <div class="version">No project is open in this window.</div>
  <button class="primary" id="new">New project…</button>
  <button id="open">Open folder…</button>
  <button id="demo">Open the demo project</button>
</aside>
<main>
  <h2>Recent projects</h2>
  <input id="filter" placeholder="Search the recent projects" aria-label="Search the recent projects">
  <ul id="recent"></ul>
</main>
<script>
  const desktop = window.pymagicDesktop;
  let recent = [];
  const nameOf = (p) => p.replace(/[\\/]+$/, '').split(/[\\/]/).pop() || p;
  const open = (folder) => { if (folder) void desktop.openProject(folder, 'this'); };

  function show() {
    const list = document.getElementById('recent');
    const q = document.getElementById('filter').value.trim().toLowerCase();
    const shown = recent.filter((p) => !q || p.toLowerCase().includes(q));
    list.replaceChildren();
    if (shown.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = recent.length ? 'No recent project matches.' : 'No recent projects.';
      list.append(li);
      return;
    }
    for (const p of shown) {
      const li = document.createElement('li');
      li.tabIndex = 0;
      li.title = p;
      const text = document.createElement('div');
      text.className = 'text';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = nameOf(p);
      const where = document.createElement('div');
      where.className = 'path';
      where.textContent = p;
      text.append(name, where);
      const remove = document.createElement('button');
      remove.className = 'remove';
      remove.title = 'Remove from recent projects';
      remove.textContent = '×';
      remove.addEventListener('click', async (e) => { e.stopPropagation(); recent = await desktop.forgetRecentProject(p); show(); });
      li.append(text, remove);
      li.addEventListener('click', () => open(p));
      li.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(p); });
      list.append(li);
    }
  }

  document.getElementById('new').addEventListener('click', () => {
    document.getElementById('new').disabled = true;
    document.querySelector('.version').textContent = 'Starting the New project dialog…';
    void desktop.newProject();
  });
  document.getElementById('open').addEventListener('click', async () => open(await desktop.chooseFolder()));
  document.getElementById('demo').addEventListener('click', async () => open(await desktop.demoFolder()));
  document.getElementById('filter').addEventListener('input', show);
  // the app's own menu (File > Open Folder…, Open the demo project) runs these in the window in front
  window.pymagic = {
    projectDesktop: () => ({
      openFolder: async () => open(await desktop.chooseFolder()),
      openDemo: async () => open(await desktop.demoFolder()),
    }),
    closeProject: () => {},
  };
  const load = () => desktop.recentProjects().then((r) => { recent = r ?? []; show(); }).catch(() => show());
  window.addEventListener('focus', load);
  void load();
</script>
</body>
</html>
