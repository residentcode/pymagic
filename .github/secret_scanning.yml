# GitHub secret scanning: these folders are copies of other projects (typeshed's stubs, the bundled JSON Schemas), kept as they are. Their
# field names (gr_passwd, password, token) describe data; they hold no secret of this project.
paths-ignore:
  - "typeshed/**"
  - "src/PyMagic.Server/Schemas/**"
  - "src/PyMagic.Server/SchemaStore/**"
