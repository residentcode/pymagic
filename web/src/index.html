<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PyMagic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="main.css">
  <style>
    :root { color-scheme: dark; --bg: #1e1f22; --panel: #2b2d30; --line: #393b40; --fg: #dfe1e5; --dim: #868a91; --accent: #3574f0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
    #app { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 1fr 24px; height: 100%; }
    #sidebar { grid-row: 1 / 3; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; }
    #sidebar h1 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 0; padding: 10px 12px; }
    #files { list-style: none; margin: 0; padding: 0 0 8px; }
    #files li { padding: 4px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #files li:hover { background: #ffffff10; }
    #files li.active { background: var(--accent); color: #fff; }
    #files li.dirty::after { content: " ●"; color: #e5c07b; }
    #editor { min-width: 0; min-height: 0; }
    #status { display: flex; gap: 16px; align-items: center; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); }
    #status .spacer { flex: 1; }
    #conn.ok { color: #6aab73; } #conn.bad { color: #e06c75; }
    @media (max-width: 700px) { #app { grid-template-columns: 1fr; } #sidebar { display: none; grid-row: auto; } }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar"><h1>Workspace</h1><ul id="files"></ul></aside>
    <div id="editor"></div>
    <footer id="status">
      <span id="conn" class="bad">connecting…</span>
      <span id="problems"></span>
      <span class="spacer"></span>
      <span id="cursor"></span>
      <span>Ctrl+S save · Ctrl+Shift+O outline · F12 definition</span>
    </footer>
  </div>
  <script src="main.js"></script>
</body>
</html>
